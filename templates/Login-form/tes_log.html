<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>/login</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #fafafa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
}
.main {
    background: #fff;
    border-radius: 12px;
    padding: 48px 40px;
    max-width: 380px;
    width: 100%;
    border: 1px solid #e8e8e8;
    animation: fadeUp 0.4s ease both;
}
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(16px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
h1 {
    font-size: 22px;
    font-weight: 700;
    color: #0a0a0a;
    margin-bottom: 28px;
    letter-spacing: -0.4px;
}
.main-content form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
#form-gmail,
#form-password {
    width: 100%;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1px solid #e2e2e2;
    font-size: 16px; /* 16px agar tidak zoom otomatis di iOS Safari */
    font-family: inherit;
    color: #0a0a0a;
    background: #fff;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
#form-gmail:focus,
#form-password:focus {
    border-color: #0a0a0a;
    box-shadow: 0 0 0 3px rgba(10, 10, 10, 0.06);
}
#form-input::placeholder,
#form-password::placeholder {
    color: #bbb;
}
button[type="button"] {
    width: 100%;
    padding: 12px 20px;
    margin-top: 4px;
    border-radius: 8px;
    border: none;
    background: #0a0a0a;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
}
button[type="button"]:hover {
    background: #222;
}
button[type="button"]:active {
    transform: scale(0.98);
}
a {
    text-decoration: none;
}
.main-navigation {
    margin-top: 4px;
    text-align: center;
}
.main-navigation p {
    font-size: 13px;
    color: #888;
    line-height: 1.6;
}
.main-navigation button {
    width: 100%;
    padding: 12px 20px;
    margin-top: 8px;
    border-radius: 8px;
    border: 1px solid #e2e2e2;
    background: #fff;
    color: #0a0a0a;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
}
.main-navigation button:hover {
    background: #f5f5f5;
}
.main-navigation button:active {
    transform: scale(0.98);
}
.back-button-corner {
    all: unset;
}
.back-btn {
    position: fixed;
    top: 16px;
    left: 16px;
    font-size: 13px;
    color: #888;
    text-decoration: none;
    transition: color 0.15s ease;
    padding: 6px 4px; /* area sentuh lebih besar di HP */
}
.back-btn:hover {
    color: #0a0a0a;
}

/* ====== RESPONSIVE: TABLET & HP ====== */
@media (max-width: 480px) {
    body {
        padding: 0;
        align-items: stretch;
        justify-content: flex-start;
    }
    .main {
        padding: 72px 28px 40px;
        border-radius: 0;
        max-width: 100%;
        width: 100%;
        min-height: 100vh;
        border: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    h1 {
        font-size: 28px;
        margin-bottom: 32px;
        text-align: center;
    }
    .main-content form {
        gap: 16px;
    }
    #form-gmail,
    #form-password {
        padding: 16px 16px;
        font-size: 17px;
        border-radius: 10px;
    }
    button[type="button"],
    .main-navigation button {
        padding: 16px 20px;
        font-size: 16px;
        border-radius: 10px;
        margin-top: 8px;
    }
    .main-navigation p {
        font-size: 15px;
        margin-top: 8px;
    }
    .back-btn {
        top: 20px;
        left: 20px;
        font-size: 15px;
        padding: 8px 10px;
    }
}

/* Layar sangat kecil (HP lama / lipat) */
@media (max-width: 320px) {
    .main {
        padding: 64px 20px 32px;
    }
    h1 {
        font-size: 24px;
    }
}
</style>
  </head>
  <body>
    
    <button class="back-button-corner">
      <a href="{{url_for('home')}}" class="back-btn">Kembali</a>
    </button>
     <div class="main">
       <h1>Login First</h1>
       <div class="main-content">
          <form>
            <input type="text" id='form-gmail' placeholder="Gmail" required><br> 
              <input type="password" id='form-password' placeholder="Password" required><br>
              <button type="button" onclick="formlog()">Login</button> 
          </form>
              <br>
          <div class="main-navigation">
            <p>Tidak Punya Akun? <a href="{{url_for('sign')}}"><br><button>Sign-Up</button></a></p>
          </div>
          <script src='{{url_for('static',filename="js/script.js")}}'></script>
       </div>
     </div>  
  </body>
</html>

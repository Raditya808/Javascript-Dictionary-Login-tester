<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>/login</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    -webkit-text-size-adjust: 100%;
}

body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #fafafa;
    min-height: 100vh;
    min-height: 100dvh;           /* tinggi layar HP yang akurat (bar browser diperhitungkan) */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 4vw, 32px);
    padding-top: 64px;            /* ruang untuk tombol Kembali */
}

/* ====== TOMBOL KEMBALI ====== */
.back-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    padding: 10px 12px;           /* area sentuh min. ~44px */
    font-size: 14px;
    color: #888;
    text-decoration: none;
    transition: color 0.15s ease;
}
.back-btn:hover {
    color: #0a0a0a;
}

/* ====== KARTU LOGIN ====== */
.main {
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e8e8e8;
    width: 100%;
    max-width: 400px;
    padding: clamp(24px, 6vw, 44px) clamp(20px, 6vw, 40px);
    animation: fadeUp 0.4s ease both;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
    .main { animation: none; }
}

h1 {
    font-size: clamp(19px, 5vw, 22px);
    font-weight: 700;
    color: #0a0a0a;
    margin-bottom: clamp(18px, 5vw, 28px);
    letter-spacing: -0.4px;
}

/* ====== FORM ====== */
.main-content form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

#form-gmail,
#form-password {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid #e2e2e2;
    font-size: 16px;              /* 16px supaya iOS Safari tidak zoom otomatis */
    font-family: inherit;
    color: #0a0a0a;
    background: #fff;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
#form-gmail:focus,
#form-password:focus {
    border-color: #0a0a0a;
    box-shadow: 0 0 0 3px rgba(10, 10, 10, 0.06);
}
#form-gmail::placeholder,
#form-password::placeholder {
    color: #aaa;
}

/* ====== TOMBOL ====== */
.btn-login,
.btn-signup {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 48px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s ease, transform 0.1s ease;
    -webkit-tap-highlight-color: transparent;
}
.btn-login {
    margin-top: 4px;
    border: none;
    background: #0a0a0a;
    color: #fff;
}
.btn-login:hover { background: #222; }

.btn-signup {
    border: 1px solid #e2e2e2;
    background: #fff;
    color: #0a0a0a;
}
.btn-signup:hover { background: #f5f5f5; }

.btn-login:active,
.btn-signup:active {
    transform: scale(0.98);
}

a:focus-visible,
button:focus-visible {
    outline: 2px solid #0a0a0a;
    outline-offset: 2px;
}

/* ====== NAVIGASI SIGN-UP ====== */
.main-navigation {
    margin-top: 20px;
    text-align: center;
}
.main-navigation p {
    font-size: 13px;
    color: #888;
    line-height: 1.6;
    margin-bottom: 8px;
}

/* ====== HP KECIL ====== */
@media (max-width: 480px) {
    body {
        align-items: flex-start;  /* kartu mulai dari atas, tidak melayang di tengah saat keyboard muncul */
        padding-top: 64px;
    }
    .main {
        border-radius: 10px;
    }
}

/* ====== HP LANDSCAPE (layar pendek) ====== */
@media (max-height: 500px) {
    body {
        align-items: flex-start;
        padding-top: 56px;
    }
}
    </style>
  </head>
  <body>

    <a href="{{ url_for('home') }}" class="back-btn">Kembali</a>

    <div class="main">
      <h1>Login First</h1>
      <div class="main-content">
        <form>
          <input type="text" id="form-gmail" placeholder="Gmail" inputmode="email" autocomplete="email" required>
          <input type="password" id="form-password" placeholder="Password" autocomplete="current-password" required>
          <button type="button" class="btn-login" onclick="formlog()">Login</button>
        </form>

        <div class="main-navigation">
          <p>Tidak punya akun?</p>
          <a href="{{ url_for('sign') }}" class="btn-signup">Sign-Up</a>
        </div>

        <script src="{{ url_for('static', filename='js/script.js') }}"></script>
      </div>
    </div>

  </body>
</html>
